name: debug mysql e2e SIGSEGV
on:
  workflow_dispatch: {}
  push:
    branches: [debug/mysql-e2e-segfault]

jobs:
  chase-segfault:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: busbar
          MYSQL_USER: busbar
          MYSQL_PASSWORD: busbar
          MYSQL_DATABASE: busbar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ubusbar -pbusbar" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout the plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Checkout busbar (sibling path dependency) at the current dev-pin
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/busbar
          ref: eac13fa3fecdd21ab3530751016a0c956e7e27b5
          path: busbarAI

      - uses: dtolnay/rust-toolchain@stable

      - name: mysql — set strict sql_mode
        run: mysql -h 127.0.0.1 -uroot -pbusbar -e "SET GLOBAL sql_mode='STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION';"

      - name: enable core dumps and install gdb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          ulimit -c unlimited
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          echo "/tmp/cores/core.%e.%p.%t" | sudo tee /proc/sys/kernel/core_pattern
          cat /proc/sys/kernel/core_pattern

      - name: build the e2e test binary
        working-directory: plugin
        run: cargo test -p busbar-store-mysql-plugin --test e2e --no-run
        env:
          BUSBAR_TEST_MYSQL_URL: mysql://busbar:busbar@127.0.0.1:3306/busbar_test

      - name: run e2e repeatedly (parallel bursts) to catch the SIGSEGV, then backtrace the core
        working-directory: plugin
        env:
          BUSBAR_TEST_MYSQL_URL: mysql://busbar:busbar@127.0.0.1:3306/busbar_test
          RUST_BACKTRACE: full
        run: |
          set +e
          ulimit -c unlimited
          BIN=$(find target/debug/deps -maxdepth 1 -name "e2e-*" -type f -executable | head -1)
          echo "BIN=$BIN"
          CRASHED=0
          find_core() { find /tmp/cores -maxdepth 1 -iname "core.*" -newer /tmp/cores 2>/dev/null | head -1; find /tmp/cores -maxdepth 1 -iname "core.*" 2>/dev/null | sort | tail -1; }
          backtrace_now() {
            CORE="$1"
            echo "CORE FOUND: $CORE"
            ls -la /tmp/cores
            gdb --batch \
              -ex "bt full" \
              -ex "info registers" \
              -ex "thread apply all bt" \
              -ex "info sharedlibrary" \
              "$BIN" "$CORE" 2>&1
            CRASHED=1
          }
          # Phase 1: default `cargo test` parallelism, repeated (matches real CI shape exactly).
          for i in $(seq 1 20); do
            echo "=== phase1 attempt $i (cargo test, default parallelism) ==="
            cargo test -p busbar-store-mysql-plugin --test e2e -- --nocapture
            rc=$?
            echo "exit code: $rc"
            if [ "$rc" != "0" ]; then
              CORE=$(find_core)
              if [ -n "$CORE" ]; then
                backtrace_now "$CORE"
                break
              else
                echo "CRASHED (rc=$rc) BUT NO CORE FILE FOUND in /tmp/cores -- listing anyway:"
                ls -la /tmp/cores 2>&1
              fi
            fi
          done
          if [ "$CRASHED" = "1" ]; then
            echo "CRASH_CAPTURED=true" >> "$GITHUB_ENV" 2>/dev/null || true
            exit 0
          fi
          # Phase 2: run the compiled binary directly, several copies AT ONCE, to stress concurrent
          # dlopen/dlclose of the same cdylib harder than the default single-process parallelism does.
          for i in $(seq 1 15); do
            echo "=== phase2 burst $i (4x concurrent binary invocations) ==="
            for j in 1 2 3 4; do
              "$BIN" --nocapture > "burst_${i}_${j}.log" 2>&1 &
            done
            wait
            for j in 1 2 3 4; do
              echo "--- burst $i copy $j tail ---"; tail -15 "burst_${i}_${j}.log"
            done
            CORE=$(find_core)
            if [ -n "$CORE" ]; then
              backtrace_now "$CORE"
              break
            fi
          done
          echo "done. CRASHED=$CRASHED"
          exit 0

      - name: upload any core files as an artifact (safety net, always runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cores-and-binary
          path: |
            /tmp/cores/
            plugin/target/debug/deps/e2e-*
          if-no-files-found: ignore
          retention-days: 3
