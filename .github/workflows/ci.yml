# Calls the canonical plugin-ci reusable workflow (GetBusbar/busbar/.github/workflows/plugin-ci.yml)
# instead of hand-copying build/test/signoff steps here — see that file for what actually runs.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@dev
    with:
      plugin_crate: busbar-store-mysql-plugin
      plugin_kind: store
      plugin_alias: mysql
      service: mysql
      # Pinned to the core line that carries the durable MCP tool-call log contract, and kept in
      # step with .busbar-ref DELIBERATELY: CI and release must build against the SAME core, or a
      # green CI run says nothing about the artifact that actually ships. `dev` does not carry the
      # contract yet, so building against it would not compile these methods. Move this and
      # .busbar-ref back to `dev` together, once that line merges.
      busbar_ref: feat/1.5.5-mcp-integrated
